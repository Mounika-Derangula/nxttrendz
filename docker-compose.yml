services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - db_data:/app/data
    # environment:
    #   APP_ENV: development
    
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # API_URL: http://backend:8000
      VITE_API_BASE_URL: "http://localhost:8000"
    depends_on:
      - backend
    

volumes:
  db_data: